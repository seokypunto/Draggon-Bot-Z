<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dragon Bot Z - Idle Realm</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #f39c12;
      --bg-dark: #0a0d14;
      --app-bg: #12161e;
      --panel-bg: rgba(20, 26, 38, 0.95);
      --border-light: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* FONDO GENERAL EN PC (SIMULA ENTORNO MÓVIL CENTRADO) */
    body {
      background-color: var(--bg-dark);
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CONTENEDOR TIPO SMARTPHONE (MANDATORIO PARA QUE EN PC NO SE DEFORME) */
    #app-wrapper {
      width: 100%;
      max-width: 450px; /* Ancho real de pantalla de móvil */
      height: 100vh;
      max-height: 920px; /* Alto máximo proporcional */
      background-color: var(--app-bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border-radius: 0px;
    }

    /* Si se abre en monitor de PC, le añade esquinas redondeadas estilo marco de móvil */
    @media (min-width: 481px) {
      #app-wrapper {
        height: 90vh;
        border-radius: 24px;
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
    }

    /* BARRA SUPERIOR DE RECURSOS COMPACTA MÓVIL */
    #header {
      background: rgba(15, 22, 32, 0.9);
      backdrop-filter: blur(8px);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      border-bottom: 1px solid var(--border-light);
    }

    .profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar-frame {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f39c12, #e67e22);
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      position: relative;
    }

    .level-tag {
      position: absolute;
      bottom: -4px;
      left: -2px;
      background: #e74c3c;
      color: #fff;
      font-size: 8px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 8px;
      border: 1px solid #fff;
    }

    .resources-bar {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 6px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .res-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }

    /* CONTENEDOR DEL MAPA (ASPECT RATIO DE MÓVIL) */
    #map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(to bottom, #74b9ff 0%, #a8e6cf 35%, #56ab2f 60%, #48b1bf 100%);
    }

    /* EDIFICIOS Y NODOS EN EL MAPA */
    .map-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease;
    }

    .map-node:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .building-icon {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      border: 2px solid #1e8449;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      position: relative;
    }

    .building-icon.castle {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #e67e22, #f39c12);
      border-color: #d35400;
      font-size: 40px;
    }

    .node-label {
      margin-top: 3px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .node-lvl { color: #f1c40f; }

    /* BOCADILLOS DE RECOLECCIÓN */
    .collect-bubble {
      position: absolute;
      top: -16px;
      background: #fff;
      color: #333;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      animation: float 2s infinite ease-in-out;
      border: 2px solid #f39c12;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* MENÚ FLOTANTE DERECHO */
    .floating-menu {
      position: absolute;
      right: 10px;
      top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 15;
    }

    .circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(20, 26, 38, 0.85);
      border: 2px solid var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      position: relative;
      cursor: pointer;
    }

    .badge-dot {
      position: absolute;
      top: 0; right: 0;
      width: 10px; height: 10px;
      background: #e74c3c;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    /* PESTAÑAS Y MODALES */
    .view-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      z-index: 25;
      display: none;
      padding: 20px;
      overflow-y: auto;
    }

    .view-modal.active { display: block; }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-color);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 8px;
    }

    /* BARRA INFERIOR DE NAVEGACIÓN COMPACTA */
    #nav-bar {
      background: #0d1117;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 6px 2px 8px 2px;
      border-top: 1px solid var(--border-light);
      z-index: 30;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 9px;
      font-weight: 600;
      gap: 2px;
      cursor: pointer;
      position: relative;
      padding: 4px 0;
      border-radius: 8px;
    }

    .nav-tab.active {
      color: #fff;
      background: rgba(243, 156, 18, 0.2);
    }

    .nav-tab.active::before {
      content: '';
      position: absolute;
      top: 0; width: 24px; height: 2px;
      background: var(--primary-color);
      border-radius: 2px;
    }

    .nav-icon { font-size: 18px; }

    .notification-count {
      position: absolute;
      top: 1px; right: 8px;
      background: #e74c3c;
      color: #fff;
      font-size: 8px;
      font-weight: bold;
      width: 14px; height: 14px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #fff;
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR MARCO MÓVIL CENTRADO -->
  <div id="app-wrapper">

    <!-- BARRA SUPERIOR DE RECURSOS -->
    <div id="header">
      <div class="profile-badge">
        <div class="avatar-frame">
          🐉
          <span class="level-tag">30</span>
        </div>
      </div>
      <div class="resources-bar">
        <div class="res-item">🌾 586K</div>
        <div class="res-item">🪵 995K</div>
        <div class="res-item">🪨 586K</div>
        <div class="res-item">💎 99</div>
      </div>
    </div>

    <!-- ÁREA DEL MAPA DEL JUEGO -->
    <div id="map-viewport">
      
      <!-- MENU FLOTANTE DERECHO -->
      <div class="floating-menu">
        <div class="circle-btn">
          🎁 <span class="badge-dot"></span>
        </div>
        <div class="circle-btn" style="border-color: #f1c40f;">
          👑 <span class="badge-dot"></span>
        </div>
        <div class="circle-btn">👥</div>
        <div class="circle-btn">💬</div>
      </div>

      <!-- NODOS DEL MAPA DE LA ALDEA -->
      <div class="map-node" style="top: 30%; left: 50%;" onclick="openModal('castillo')">
        <div class="building-icon castle">🏯</div>
        <div class="node-label">
          <span class="node-lvl">30</span> Castillo
        </div>
      </div>

      <div class="map-node" style="top: 50%; left: 24%;" onclick="openModal('aserradero')">
        <div class="collect-bubble">🪵</div>
        <div class="building-icon">🪓</div>
        <div class="node-label">
          <span class="node-lvl">28</span> Aserradero
        </div>
      </div>

      <div class="map-node" style="top: 48%; left: 76%;" onclick="openModal('granja')">
        <div class="collect-bubble">🌾</div>
        <div class="building-icon" style="background: linear-gradient(135deg, #f1c40f, #f39c12);">🌾</div>
        <div class="node-label">
          <span class="node-lvl">28</span> Granja
        </div>
      </div>

      <div class="map-node" style="top: 66%; left: 48%;" onclick="openModal('combates')">
        <div class="building-icon" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">🎯</div>
        <div class="node-label">
          <span class="node-lvl">28</span> Campo Tiro
        </div>
      </div>

      <div class="map-node" style="top: 75%; left: 78%;" onclick="openModal('cuarteles')">
        <div class="building-icon" style="background: linear-gradient(135deg, #8e44ad, #9b59b6);">⚔️</div>
        <div class="node-label">
          <span class="node-lvl">29</span> Cuarteles
        </div>
      </div>

      <div class="map-node" style="top: 82%; left: 28%;" onclick="openModal('establo')">
        <div class="building-icon" style="background: linear-gradient(135deg, #d35400, #e67e22);">🐎</div>
        <div class="node-label">
          <span class="node-lvl">27</span> Establo
        </div>
      </div>

      <!-- MODALES -->
      <div id="modal-castillo" class="view-modal">
        <div class="modal-title">🏯 Castillo Principal</div>
        <p style="text-align: center; color: #aaa;">Sede central de la aldea.</p>
        <button class="circle-btn" style="margin: 20px auto 0; width: auto; padding: 8px 16px; border-radius: 8px; font-size: 13px;" onclick="closeModals()">Cerrar</button>
      </div>

      <div id="modal-combates" class="view-modal">
        <div class="modal-title">⚔️ Zona de Combate</div>
        <p style="text-align: center; color: #aaa;">Combates PVE / PVP.</p>
        <button class="circle-btn" style="margin: 20px auto 0; width: auto; padding: 8px 16px; border-radius: 8px; font-size: 13px;" onclick="closeModals()">Cerrar</button>
      </div>

      <div id="modal-clan" class="view-modal">
        <div class="modal-title">🛡️ Tu Clan</div>
        <p style="text-align: center; color: #aaa;">Sección de Clan.</p>
        <button class="circle-btn" style="margin: 20px auto 0; width: auto; padding: 8px 16px; border-radius: 8px; font-size: 13px;" onclick="closeModals()">Cerrar</button>
      </div>

      <div id="modal-misiones" class="view-modal">
        <div class="modal-title">📜 Misiones Diarias</div>
        <p style="text-align: center; color: #aaa;">Recompensas diarias.</p>
        <button class="circle-btn" style="margin: 20px auto 0; width: auto; padding: 8px 16px; border-radius: 8px; font-size: 13px;" onclick="closeModals()">Cerrar</button>
      </div>

    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <div id="nav-bar">
      <button class="nav-tab active" onclick="switchTab('ciudad')">
        <span class="nav-icon">🏰</span>
        <span>Ciudad</span>
      </button>
      <button class="nav-tab" onclick="switchTab('combates')">
        <span class="nav-icon">⚔️</span>
        <span>Combates</span>
      </button>
      <button class="nav-tab" onclick="switchTab('clan')">
        <span class="nav-icon">🛡️</span>
        <span>Clan</span>
      </button>
      <button class="nav-tab" onclick="switchTab('misiones')">
        <span class="nav-icon">📜</span>
        <span>Misiones</span>
        <span class="notification-count">1</span>
      </button>
      <button class="nav-tab" onclick="switchTab('perfil')">
        <span class="nav-icon">👤</span>
        <span>Perfil</span>
      </button>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
    }

    function closeModals() {
      document.querySelectorAll('.view-modal').forEach(el => el.classList.remove('active'));
    }

    function openModal(id) {
      closeModals();
      const target = document.getElementById(`modal-${id}`);
      if (target) target.classList.add('active');
    }

    function switchTab(tabId) {
      closeModals();
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      
      const btnIndex = ['ciudad', 'combates', 'clan', 'misiones', 'perfil'].indexOf(tabId);
      if (btnIndex !== -1) document.querySelectorAll('.nav-tab')[btnIndex].classList.add('active');

      if (tabId !== 'ciudad') {
        openModal(tabId);
      }
    }
  </script>
</body>
</html>
